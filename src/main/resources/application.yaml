spring:
  application:
    name: geminiAi

  datasource:
    url: jdbc:mysql://mysql:3306/foodbot?serverTimezone=Asia/Seoul
    # ⭐ localhost → mysql
    # ⭐ foodbot → blogdb
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ❌ Redis 설정 전부 삭제!
  # data:
  #   redis:
  # session:
  #   store-type: redis

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}  # ⭐ 환경 변수에서 가져옴
        chat:
          options:
            model: gemini-2.5-flash-lite

server:
  port: ${SERVER_PORT:8082}  # ⭐ 환경 변수 또는 8082