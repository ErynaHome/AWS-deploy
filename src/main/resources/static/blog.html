<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 블로그 생성기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .type-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .type-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .type-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .type-btn small {
            display: block;
            margin-top: 5px;
            opacity: 0.8;
            font-size: 0.8em;
        }

        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .blog-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.8;
        }

        /* 로딩 */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 AI 블로그 생성기</h1>
        
        <!-- 입력 섹션 -->
        <div class="input-section">
            <label for="topic">주제를 입력하세요</label>
            <input type="text" 
                   id="topic" 
                   placeholder="예: Docker 입문, Spring Boot 시작하기..."
                   onkeypress="handleEnter(event)">
        </div>
        
        <!-- SNS 타입 선택 -->
        <div class="input-section">
            <label>글 타입 선택</label>
            <div class="type-selector">
                <button class="type-btn" data-type="BLOG" onclick="selectType('BLOG')">
                    📝 블로그
                    <small>정확하고 상세하게</small>
                </button>
                
                <button class="type-btn" data-type="TWITTER" onclick="selectType('TWITTER')">
                    🐦 트위터
                    <small>짧고 임팩트있게</small>
                </button>
                
                <button class="type-btn active" data-type="INSTAGRAM" onclick="selectType('INSTAGRAM')">
                    📸 인스타그램
                    <small>감성적이고 공감되게</small>
                </button>
                
                <button class="type-btn" data-type="LINKEDIN" onclick="selectType('LINKEDIN')">
                    💼 링크드인
                    <small>전문적이고 인사이트</small>
                </button>
                
                <button class="type-btn" data-type="FACEBOOK" onclick="selectType('FACEBOOK')">
                    👥 페이스북
                    <small>토론과 참여 유도</small>
                </button>
            </div>
        </div>
        
        <!-- 생성 버튼 -->
        <button class="generate-btn" 
                id="generateBtn" onclick="generateBlog()">
            🚀 AI 글 생성하기
        </button>
        
        <!-- 로딩 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI가 글을 작성하고 있습니다...</p>
        </div>
        
        <!-- 결과 섹션 -->
        <div class="result-section" id="resultSection">
            <h2>생성된 글</h2>
            <div class="blog-content" id="blogContent"></div>
        </div>
    </div>

    <script>
        let type = "INSTAGRAM"
        let currentBlog = NULL;


        async function generateBlog(){
            const topic = document
                            .getElementById("topic").value.trim();



            // 유효성 검증
            if(!topic){
                alert("주제 입력하세요!");
                return ;
            }
            const res = await fetch('/blog/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    topic: topic,
                    type: "INSTAGRAM"
                })
            });

            const data = res.text();
            console.log("넘어온 데이터" + data);

        }

        function handleEnter(){}
    </script>


</body>

</html>
