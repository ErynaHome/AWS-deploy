services:
  mysql:  # ✅ 이름 변경 (db → mysql)
    image: mysql:8
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: foodbot  # ⭐ foodbot → blogdb

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    restart: always

  app:  # ✅ 이름 변경 (app1 → app)
    build:
      context: .             
      dockerfile: Dockerfile   
    container_name: blog-ai
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}  # ⭐ .env에서 가져옴
    depends_on:  # ⭐ 추가 (MySQL 먼저 실행)
      - mysql
    restart: unless-stopped